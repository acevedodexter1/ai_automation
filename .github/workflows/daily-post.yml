name: Daily YouTube post

on:
  schedule:
    - cron: "0 4,12 * * *"   # UTC. 04:00 and 12:00 UTC = 12:00 PM and 8:00 PM in UTC+8 (Philippines).
  workflow_dispatch:           # lets you run it by hand from the Actions tab
    inputs:
      privacy:                 # CHANGED: replaces dry_run / youtube_test. Use "private" to test safely.
        description: "YouTube privacy for this run (scheduled runs use the YT_PRIVACY variable, default public)"
        type: choice
        options: [public, unlisted, private]
        default: private
      quality:
        description: "Video quality: standard (720p) or high (1080p)"
        type: choice
        options: [standard, high]
        default: standard
      duration:
        description: "Length in seconds (auto = random pick of 30 / 60 / 90)"
        type: choice
        options: [auto, "30", "60", "90", "120"]
        default: auto
      music:
        description: "Built-in music style (ignored if assets/music has your own tracks)"
        type: choice
        options: [cinematic, epic, upbeat, calm, playful]
        default: cinematic
      topic:
        description: "Optional: force a topic, e.g. black bear   (or: topic | subject)"
        required: false
        default: ""

permissions:
  contents: write          # lets the job save the list of posted topics back to the repo

concurrency:
  group: daily-post
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r backend/requirements.txt

      - name: Start backend on the runner and make the video
        id: post
        env:
          # ---- backend settings (same values as render.yaml) ----
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          LLM_BACKEND: api
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: openai/gpt-oss-120b
          LLM_FALLBACK_BACKENDS: "hf_api"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LLM_FALLBACK_MODELS: openai/gpt-oss-20b,llama-3.1-8b-instant
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_BACKEND: stock
          STOCK_PROVIDERS: nasa,wikimedia,archive,smithsonian,pixabay,pexels
          STOCK_AI_FALLBACK: "true"
          STOCK_CONTACT: ${{ vars.STOCK_CONTACT }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_BACKEND: cloudflare
          TTS_FALLBACK: kokoro
          TTS_FALLBACK_INSTALL: "true"
          VIDEO_BACKEND: none
          FFMPEG_THREADS: "2"
          KEN_BURNS: "true"
          VIDEO_QUALITY: ${{ github.event.inputs.quality || 'standard' }}
          MAX_CONCURRENT_JOBS: "1"
          MAX_QUEUE: "1"
          STORAGE_LIMIT_MB: "2000"
          # ---- posting settings ----
          API_URL: http://127.0.0.1:8000
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}        # not used now, kept in case the script still reads it
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}  # not used now, kept in case the script still reads it
          NICHE: ${{ vars.NICHE }}
          AUDIENCE: ${{ vars.AUDIENCE }}
          FB_MODE: auto
          STYLE: cinematic
          TONE: energetic
          MUSIC_STYLE: ${{ github.event.inputs.music || 'cinematic' }}
          MUSIC_DIR: ${{ github.workspace }}/assets/music
          DURATIONS: "30,60,90"
          DURATION: ${{ github.event.inputs.duration }}
          TOPIC: ${{ github.event.inputs.topic }}
          FB_STATE: PUBLISHED
          DRY_RUN: "true"                  # CHANGED: always "make the video but do not post" -> nothing goes to Facebook
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 2
          done
          set -o pipefail
          python scripts/daily_post.py 2>&1 | tee run.log

      - name: Backend log (only when something failed)
        if: failure()
        run: tail -n 100 backend.log

      - name: Save the list of posted topics
        if: always()                       # CHANGED: no more dry_run check
        run: |
          if [ -n "$(git status --porcelain data/posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posted.json
            git commit -m "Record posted topic [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload the video to YouTube
        id: youtube
        if: steps.post.outcome == 'success'   # CHANGED: runs on every successful video
        timeout-minutes: 20
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ github.event.inputs.privacy || vars.YT_PRIVACY || 'public' }}   # CHANGED
        run: |
          python scripts/youtube_upload.py 2>&1 | tee -a run.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" = "2" ]; then exit 0; fi   # 2 = no YouTube secrets set yet, simply skip
          exit "$rc"

      - name: Keep the video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: |
            video.mp4
            thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 3

      - name: Send me a detailed Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.post.outcome }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify.py